limit_req_zone $binary_remote_addr zone=alice:10m rate=5r/s;

server {
    listen 443 ssl;
    server_name 216.57.104.246;

    ssl_certificate /etc/letsencrypt/live/216.57.104.246/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/216.57.104.246/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;

    location /alice/ {
        limit_req zone=alice burst=10 nodelay;
        proxy_pass http://bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 4s;
    }

    location / {
        return 404;
    }
}
